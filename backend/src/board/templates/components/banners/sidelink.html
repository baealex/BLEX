{% if link_url %}<a href="{{ link_url }}"{% else %}<div{% endif %} class="group flex min-h-11 items-center justify-between gap-3 rounded-xl border px-4 py-3 transition-colors duration-150 {% if is_emphasis %}border-transparent bg-action text-content-inverted{% if link_url %} hover:bg-action-hover{% endif %}{% else %}border-line bg-surface-subtle text-content{% if link_url %} hover:border-line-strong{% endif %}{% endif %}">
    <span class="min-w-0">
        <span class="block break-words text-sm font-semibold leading-snug">{{ banner.headline }}</span>
        {% if banner.description %}
        <span class="mt-0.5 block break-words text-xs leading-relaxed {% if is_emphasis %}opacity-75{% else %}text-content-secondary{% endif %}">{{ banner.description }}</span>
        {% endif %}
    </span>
    {% if link_url %}
    <i class="fas fa-arrow-right flex-shrink-0 text-xs {% if is_emphasis %}text-content-inverted{% else %}text-content-hint group-hover:text-content{% endif %}" aria-hidden="true"></i>
    {% endif %}
{% if link_url %}</a>{% else %}</div>{% endif %}
