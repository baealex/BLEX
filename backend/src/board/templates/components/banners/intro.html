{% load i18n %}
<div class="rounded-2xl border p-5 {% if is_emphasis %}border-transparent bg-action text-content-inverted{% else %}border-line bg-surface-subtle text-content{% endif %}">
    <p class="break-words text-base font-bold leading-snug">{{ banner.headline }}</p>
    {% if banner.description %}
    <p class="mt-2 break-words text-sm leading-relaxed {% if is_emphasis %}text-content-inverted/75{% else %}text-content-secondary{% endif %}">{{ banner.description|linebreaksbr }}</p>
    {% endif %}
    {% if link_url %}
    <a href="{{ link_url }}" class="mt-4 flex min-h-11 w-full items-center justify-center rounded-lg px-4 text-sm font-semibold transition-colors duration-150 active:scale-95 {% if is_emphasis %}bg-surface text-content hover:bg-surface-subtle{% else %}bg-action text-content-inverted hover:bg-action-hover{% endif %}">
        {% if banner.link_label %}{{ banner.link_label }}{% else %}{% translate "Learn more" context "Banner link label" %}{% endif %}
    </a>
    {% endif %}
</div>
