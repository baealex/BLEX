{% load i18n %}
<div class="rounded-2xl border px-6 py-8 text-center sm:px-8 {% if is_emphasis %}border-transparent bg-action text-content-inverted{% else %}border-line bg-surface-subtle text-content{% endif %}">
    <p class="break-words text-xl font-bold leading-snug">{{ banner.headline }}</p>
    {% if banner.description %}
    <p class="mx-auto mt-2 max-w-md break-words text-sm leading-relaxed {% if is_emphasis %}opacity-75{% else %}text-content-secondary{% endif %}">{{ banner.description|linebreaksbr }}</p>
    {% endif %}
    {% if link_url %}
    <a href="{{ link_url }}" class="mt-5 inline-flex min-h-11 items-center justify-center rounded-full px-6 text-sm font-semibold transition-colors duration-150 active:scale-95 {% if is_emphasis %}bg-surface text-content hover:bg-surface-subtle{% else %}bg-action text-content-inverted hover:bg-action-hover{% endif %}">
        {% if banner.link_label %}{{ banner.link_label }}{% else %}{% translate "Learn more" context "Banner link label" %}{% endif %}
    </a>
    {% endif %}
</div>
