{% load i18n %}
{% if link_url %}<a href="{{ link_url }}"{% else %}<div{% endif %} class="blex-banner blex-banner--notice" data-tone="{{ data.tone }}">
    <span class="blex-banner__inner">
        {% if data.eyebrow %}<span class="blex-banner__eyebrow">{{ data.eyebrow }}</span>{% endif %}
        <span class="blex-banner__title">{{ data.headline }}</span>
        {% if link_url %}
        <span class="blex-banner__more">
            {% if data.link_label %}{{ data.link_label }}{% else %}{% translate "Learn more" context "Banner link label" %}{% endif %}
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </span>
        {% endif %}
    </span>
{% if link_url %}</a>{% else %}</div>{% endif %}
