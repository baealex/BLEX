{% load i18n %}
<div class="flex overflow-hidden rounded-xl bg-surface-subtle text-content">
    <div class="w-1 shrink-0 {% if is_emphasis %}bg-action{% else %}bg-line-strong{% endif %}" aria-hidden="true"></div>
    <div class="min-w-0 px-5 py-4">
        <p class="break-words text-sm font-semibold leading-relaxed">{{ banner.headline }}</p>
        {% if banner.description %}
        <p class="mt-1 break-words text-sm leading-relaxed text-content-secondary">{{ banner.description|linebreaksbr }}</p>
        {% endif %}
        {% if link_url %}
        <a href="{{ link_url }}" class="mt-2 inline-flex min-h-11 items-center gap-1.5 text-sm font-semibold text-content underline underline-offset-2 transition-colors duration-150 hover:text-content-secondary">
            {% if banner.link_label %}{{ banner.link_label }}{% else %}{% translate "Learn more" context "Banner link label" %}{% endif %}
            <i class="fas fa-arrow-right text-xs" aria-hidden="true"></i>
        </a>
        {% endif %}
    </div>
</div>
