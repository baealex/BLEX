services:
  blex:
    build:
      context: .
    env_file: ${BLEX_ENV_FILE:-./.env}
    environment:
      BLEX_PORT_MAPPING: ${BLEX_PORT_MAPPING:-127.0.0.1:20002:8040}
    restart: unless-stopped
    volumes:
      - ${BLEX_DATA:-blex-data}:/var/lib/blex
      # BLEX imports a 3.14 install from here once, on its first start.
      - type: bind
        source: ./backend/src
        target: /legacy
        read_only: true
        bind:
          create_host_path: true
    ports:
      - "${BLEX_PORT_MAPPING:-127.0.0.1:20002:8040}"

volumes:
  blex-data:
