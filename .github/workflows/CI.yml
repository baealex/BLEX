name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm test
      - name: Validate Prisma schema
        run: pnpm --filter @blex/server exec prisma validate
        env:
          DATABASE_URL: file:/tmp/blex-validation.sqlite3
      - name: Check the React screens
        run: |
          pnpm i18n:check
          pnpm lint
          pnpm type-check
          pnpm test:web
          pnpm build:web
          pnpm check:entry-budgets

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile --filter @blex/web
      - run: pnpm --filter @blex/web exec playwright install --with-deps --only-shell chromium
      - name: Build runtime and migration images
        run: |
          docker build --pull --target migration --tag blex-migration:ci .
          docker build --tag blex:ci .

      - name: Verify the Node runtime and first launch with 512 MiB
        run: |
          docker run --rm --entrypoint sh blex:ci -ec '
            ! command -v python
            ! command -v python3
            ! command -v gunicorn
            test -f /app/packages/server/dist/client/.vite/manifest.json
            ffmpeg -version >/dev/null
          '
          docker volume create blex-ci-data
          cleanup() {
            docker logs blex-ci || true
            docker rm -f blex-ci || true
            docker volume rm blex-ci-data || true
          }
          trap cleanup EXIT
          docker run --rm --network none -v blex-ci-data:/var/lib/blex blex-migration:ci
          docker run -d --name blex-ci -p 127.0.0.1:8040:8040 --memory=512m --cpus=1 \
            -v blex-ci-data:/var/lib/blex \
            -e INITIAL_SETUP_TOKEN=ci-setup-token \
            -e SITE_URL=http://127.0.0.1:8040 -e SECRET_KEY=ci-ephemeral-session-key \
            -e CIPHER_KEY=0123456789abcdef0123456789abcdef blex:ci
          docker exec blex-ci node --input-type=module -e '
            for (let attempt = 0; attempt < 40; attempt += 1) {
              try {
                const response = await fetch("http://127.0.0.1:8040/setup");
                if (response.ok && (await response.text()).includes("첫 관리자 만들기")) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error("BLEX setup page did not become ready");
          '
          BLEX_SETUP_TOKEN=ci-setup-token pnpm test:smoke
