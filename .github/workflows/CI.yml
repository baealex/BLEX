name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Validate Prisma schema
        run: npx --no-install prisma validate
        env:
          DATABASE_URL: file:/tmp/blex-validation.sqlite3

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime and migration images
        run: |
          docker build --pull --target migration --tag blex-migration:ci ./v4
          docker build --tag blex:ci ./v4

      - name: Scan BLEX image
        uses: ./.github/actions/image-security
        with:
          image: blex:ci
          platform: linux/amd64
          image-source: docker
          category: blex-container-amd64

      - name: Verify the Node runtime and first launch with 512 MiB
        run: |
          docker run --rm --entrypoint sh blex:ci -ec '
            ! command -v python
            ! command -v python3
            ! command -v gunicorn
            test -f /app/dist/client/.vite/manifest.json
            ffmpeg -version >/dev/null
          '
          docker volume create blex-ci-data
          cleanup() {
            docker logs blex-ci || true
            docker rm -f blex-ci || true
            docker volume rm blex-ci-data || true
          }
          trap cleanup EXIT
          docker run --rm --network none -v blex-ci-data:/var/lib/blex blex-migration:ci
          docker run -d --name blex-ci --network none --memory=512m --cpus=1 \
            -v blex-ci-data:/var/lib/blex \
            -e SITE_URL=http://127.0.0.1:8040 -e SECRET_KEY=ci-ephemeral-session-key \
            -e CIPHER_KEY=0123456789abcdef0123456789abcdef blex:ci
          docker exec blex-ci node --input-type=module -e '
            for (let attempt = 0; attempt < 40; attempt += 1) {
              try {
                const response = await fetch("http://127.0.0.1:8040/setup");
                if (response.ok && (await response.text()).includes("첫 관리자 만들기")) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error("BLEX setup page did not become ready");
          '
