name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend_ci:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Load .env file
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import os

        env_file = Path('samples/.env')
        github_env = Path(os.environ['GITHUB_ENV'])

        with github_env.open('a') as output:
            for raw_line in env_file.read_text().splitlines():
                line = raw_line.strip()
                if not line or line.startswith('#') or '=' not in line:
                    continue

                key, value = line.split('=', 1)
                value = value.strip()
                if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                    value = value[1:-1]

                output.write(f'{key.strip()}={value}\n')
        PY

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.22.2'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: backend/src

    - name: Check backend migrations
      run: npm run server:check-migrations

    - name: Test Backend
      run: npm run server:test

  islands_ci:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.22.2'

    - name: Install pnpm
      run: npm install --global pnpm@11.12.0

    - name: Install Islands dependencies
      run: pnpm install
      working-directory: backend/islands

    - name: Lint Islands
      run: pnpm lint
      working-directory: backend/islands

    - name: Type check Islands
      run: pnpm type-check
      working-directory: backend/islands

    - name: Unit test Islands
      run: pnpm test
      working-directory: backend/islands

    - name: Build Islands
      run: pnpm run build
      working-directory: backend/islands

    - name: Check bootstrap entry budgets
      run: pnpm run check:entry-budgets
      working-directory: backend/islands

    - name: Set up Python for browser smoke
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Python dependencies for browser smoke
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: backend/src

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('backend/islands/pnpm-lock.yaml') }}

    - name: Install Playwright Chromium
      run: pnpm --filter @blex/remotes exec playwright install --with-deps chromium
      working-directory: backend/islands

    - name: Run editor browser regression tests
      run: >-
        pnpm --filter @blex/remotes exec playwright test
        --config playwright.config.ts
        e2e/editor-media-upload.spec.ts
      working-directory: backend/islands
      env:
        BLEX_E2E_ENV_FILE: ${{ github.workspace }}/samples/.env

  container_ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.22.2'

    - name: Install pnpm
      run: npm install --global pnpm@11.12.0

    - name: Install Islands dependencies
      run: pnpm install --frozen-lockfile
      working-directory: backend/islands

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('backend/islands/pnpm-lock.yaml') }}

    - name: Install Playwright Chromium
      run: pnpm --filter @blex/remotes exec playwright install --with-deps chromium
      working-directory: backend/islands

    - name: Build unified BLEX image
      run: docker build --tag blex:ci ./backend

    - name: Audit unified runtime contents
      run: |
        docker run --rm --entrypoint sh blex:ci -c '
          leftovers=$(find /app -xdev \
            \( -name node_modules \
              -o -name .turbo \
              -o -name .cache \
              -o -name __pycache__ \
              -o -name "*.pyc" \
              -o -name "*.pyo" \
              -o -name "*.map" \
              -o -name "*.ts" \
              -o -name "*.tsx" \
              -o -name "*.scss" \
              -o -name package.json \
              -o -name pnpm-lock.yaml \
            \) -print)

          test -z "$leftovers"
          test -z "$(find /var/lib/apt/lists /var/cache/apt /var/cache/debconf \
            -mindepth 1 -print 2>/dev/null)"
        '

    - name: Verify child process failure is detected
      run: |
        docker run \
          --detach \
          --name blex-ci-fault \
          --env-file samples/.env \
          --env RUN_MIGRATIONS_ON_START=false \
          blex:ci

        cleanup() {
          docker logs blex-ci-fault || true
          docker rm --force blex-ci-fault || true
        }
        trap cleanup EXIT

        for attempt in $(seq 1 30); do
          docker exec blex-ci-fault test -s /run/nginx.pid && break
          sleep 1
        done

        docker exec blex-ci-fault nginx -s quit
        test "$(docker wait blex-ci-fault)" = 1

    - name: Run unified container smoke
      run: |
        docker run \
          --detach \
          --name blex-ci \
          --env-file samples/.env \
          --env DEBUG=FALSE \
          --env SITE_URL=http://127.0.0.1:18080 \
          --publish 127.0.0.1:18080:80 \
          blex:ci

        cleanup() {
          docker logs blex-ci || true
          docker rm --force blex-ci || true
        }
        trap cleanup EXIT

        for attempt in $(seq 1 60); do
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null && break
          sleep 1
        done

        curl --fail --silent --show-error \
          http://127.0.0.1:18080/resources/staticfiles/islands/.vite/manifest.json \
          > /dev/null
        docker cp \
          backend/islands/apps/remotes/e2e/fixtures/installed-site.json \
          blex-ci:/tmp/installed-site.json
        docker exec blex-ci python manage.py loaddata /tmp/installed-site.json
        docker exec blex-ci python manage.py shell -c \
          'from django.conf import settings; assert settings.DEBUG is False'
        docker exec blex-ci python manage.py migrate --check
        docker exec blex-ci python manage.py check
        docker exec blex-ci nginx -t

        E2E_BASE_URL=http://127.0.0.1:18080 \
          E2E_SKIP_WEB_SERVER=1 \
          E2E_EXPECT_PRODUCTION=1 \
          pnpm --dir backend/islands/apps/remotes exec \
          playwright test \
          --config playwright.config.ts \
          e2e/island-smoke.spec.ts

        docker restart blex-ci
        for attempt in $(seq 1 60); do
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null && break
          sleep 1
        done

        docker stop --time 10 blex-ci
        test "$(docker inspect blex-ci --format '{{.State.ExitCode}}')" = 0
