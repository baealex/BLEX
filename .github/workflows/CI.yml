name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Check release automation
        run: node --test .github/scripts/release.test.mjs
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm test
      - name: Validate Prisma schema
        run: pnpm --filter @blex/server exec prisma validate
        env:
          DATABASE_URL: file:/tmp/blex-validation.sqlite3
      - name: Check the React screens
        run: |
          pnpm i18n:check
          pnpm lint
          pnpm type-check
          pnpm test:client
          pnpm build:client
          pnpm check:entry-budgets
