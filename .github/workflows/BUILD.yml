name: Release
run-name: Release ${{ inputs.version || 'next version' }} from main

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MAJOR.MINOR without v; leave empty for the next minor in the current major'
        type: string
        required: false

permissions:
  contents: read

env:
  IMAGE: baealex/blex

concurrency:
  group: blex-release
  cancel-in-progress: false

jobs:
  application:
    uses: ./.github/workflows/CI.yml

  prepare:
    needs: application
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Resolve the release version and commit
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/release.mjs prepare

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.release.outputs.sha }}
      - name: Build the release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          no-cache-filters: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the candidate awaiting verification
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Candidate %s awaiting verification\n\n' "$RELEASE_VERSION"
            printf 'Commit: `%s`\n\nImage: `%s@%s`\n' "$RELEASE_SHA" "$IMAGE" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: amd64, runner: ubuntu-24.04 }
          - { architecture: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile --filter @blex/client
      - name: Install the smoke test browser
        run: pnpm --filter @blex/client exec playwright install --with-deps --only-shell chromium

      - name: Launch with 512 MiB and run the browser smoke test
        env:
          RUNTIME_IMAGE: ${{ env.IMAGE }}@${{ needs.prepare.outputs.digest }}
          PLATFORM: linux/${{ matrix.architecture }}
        run: |
          docker pull --platform "$PLATFORM" "$RUNTIME_IMAGE"
          docker run --rm --platform "$PLATFORM" --entrypoint ffmpeg "$RUNTIME_IMAGE" -version >/dev/null
          docker volume create blex-release-data
          cleanup() {
            docker logs blex-release || true
            docker rm -f blex-release || true
            docker volume rm blex-release-data || true
          }
          trap cleanup EXIT
          docker run -d --platform "$PLATFORM" --name blex-release -p 127.0.0.1:8040:8040 --memory=512m --cpus=1 \
            -v blex-release-data:/var/lib/blex \
            -e INITIAL_SETUP_TOKEN=ci-setup-token \
            -e SITE_URL=http://127.0.0.1:8040 -e SECRET_KEY=ci-ephemeral-session-key \
            -e CIPHER_KEY=0123456789abcdef0123456789abcdef "$RUNTIME_IMAGE"
          docker exec blex-release node --input-type=module -e '
            for (let attempt = 0; attempt < 120; attempt += 1) {
              try {
                const response = await fetch("http://127.0.0.1:8040/setup");
                if (response.ok && (await response.text()).includes("첫 관리자 만들기")) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error("BLEX setup page did not become ready");
          '
          BLEX_SETUP_TOKEN=ci-setup-token pnpm test:smoke

      - name: Scan the candidate image
        if: ${{ !cancelled() }}
        uses: ./.github/actions/image-security
        with:
          image: ${{ env.IMAGE }}@${{ needs.prepare.outputs.digest }}
          platform: linux/${{ matrix.architecture }}
          category: blex-container-${{ matrix.architecture }}

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified image and Git version tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs publish
