name: BUILD

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE: baealex/blex

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  image_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          tagged_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

      - name: Resolve release version
        id: release
        if: github.ref_type == 'tag'
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - run: npm install --global pnpm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @blex/server exec prisma validate
        env:
          DATABASE_URL: file:/tmp/blex-validation.sqlite3

      - run: pnpm test

      - name: Install the smoke test browser
        run: pnpm --filter @blex/client exec playwright install --with-deps --only-shell chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ github.sha }}

      - name: Build BLEX candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          no-cache-filters: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Launch with 512 MiB and run the browser smoke test
        env:
          RUNTIME_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$RUNTIME_IMAGE"
          docker run --rm --platform linux/amd64 --entrypoint ffmpeg "$RUNTIME_IMAGE" -version >/dev/null
          docker volume create blex-release-data
          cleanup() {
            docker logs blex-release || true
            docker rm -f blex-release || true
            docker volume rm blex-release-data || true
          }
          trap cleanup EXIT
          docker run -d --platform linux/amd64 --name blex-release -p 127.0.0.1:8040:8040 --memory=512m --cpus=1 \
            -v blex-release-data:/var/lib/blex \
            -e INITIAL_SETUP_TOKEN=ci-setup-token \
            -e SITE_URL=http://127.0.0.1:8040 -e SECRET_KEY=ci-ephemeral-session-key \
            -e CIPHER_KEY=0123456789abcdef0123456789abcdef "$RUNTIME_IMAGE"
          docker exec blex-release node --input-type=module -e '
            for (let attempt = 0; attempt < 120; attempt += 1) {
              try {
                const response = await fetch("http://127.0.0.1:8040/setup");
                if (response.ok && (await response.text()).includes("첫 관리자 만들기")) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error("BLEX setup page did not become ready");
          '
          BLEX_SETUP_TOKEN=ci-setup-token pnpm test:smoke

      - name: Scan AMD64 candidate
        uses: ./.github/actions/image-security
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          category: blex-container-amd64

      - name: Scan ARM64 candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/image-security
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          category: blex-container-arm64

      - name: Publish verified release tags
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          major="${RELEASE_VERSION%%.*}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${RELEASE_VERSION}" \
            --tag "${IMAGE}:${major}" \
            "${IMAGE}@${IMAGE_DIGEST}"

      - name: Verify multi-platform release image
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          major="${RELEASE_VERSION%%.*}"
          for tag in "$RELEASE_VERSION" "$major"; do
            manifest=$(docker buildx imagetools inspect "${IMAGE}:${tag}")
            grep -q 'linux/amd64' <<< "$manifest"
            grep -q 'linux/arm64' <<< "$manifest"
            digest=$(awk '/^Digest:/ { print $2 }' <<< "$manifest")
            test "$digest" = "$IMAGE_DIGEST"
          done
